name: Identity resolution pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * *"   # daily

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_LOGGING_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q tests

      - name: Run the Prefect flow (S3 via moto, dbt build with tests, scoring, monitoring)
        run: python flows/pipeline_flow.py

      - name: Save the latest reports and exports
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports exports
          git diff --cached --quiet || git commit -m "Update pipeline reports"
          git push
